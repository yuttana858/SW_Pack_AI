# Board material record — EMPTY TEMPLATE
# Copy to company/materials/<supplier>-<grade-id>.yaml and fill from the supplier certificate.
# Field definitions and validation rules: corpus/materials/material-record-schema.md
# Units: mm, g/m2, kN/m, kPa, %, degrees. Leave unknown values as null.

record:
