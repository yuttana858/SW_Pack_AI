  supplier: null
  supplierGradeId: null
  plant: null
  boardType: null             # single-wall | double-wall | triple-wall | single-face | solid-board | folding-carton
  gradeCode: null             # e.g. 125K/C/125T
  carrierGrade: null          # e.g. 32ECT or 200# (NMFC Item 222 / UFC Rule 41)
  certificateRef: null
  certificateDate: null       # YYYY-MM-DD
  validUntil: null            # YYYY-MM-DD
  confidence: null            # supplier-certified | house-measured | industry-typical
  approvedBy: null
  notes: null

material:
  flute: null                 # A B C E F G N K BC EB AC EE AAA ACA none
  outsideLinerGrade: null
  insideLinerGrade: null
  centreLinerGrade: null
  mediumGrade: null
