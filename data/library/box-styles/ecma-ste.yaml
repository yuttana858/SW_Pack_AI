title: ECMA straight tuck end (STE)
notes: >-
  ECMA Code of Folding Carton Design Styles, revised edition September 2009. Trade-name to code mapping
  is the corpus's reading of ECMA code definitions and drawings; ECMA gives codes, not names. Description
  is our own wording. Alternative illustrated code A20.20.03.03 (differs only in which panel carries the
  tucks); 1992 codes A2320 / A2420. The truncated 'A20.20.03' in one guide is incomplete. Erection flag
  not recorded in the corpus.
