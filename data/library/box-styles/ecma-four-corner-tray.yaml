title: ECMA four-corner glued tray
notes: >-
  ECMA Code of Folding Carton Design Styles, revised edition September 2009. Trade-name to code mapping
  is the corpus's reading of ECMA code definitions and drawings; ECMA gives codes, not names. Description
  is our own wording. Related codes: B40.21.00.00 webbed corners; B40.22.00.00 corners fold down inward
  (flag M). No manufacturer's side-seam joint; corners are glued (the joint enum has no corner-glue value).
