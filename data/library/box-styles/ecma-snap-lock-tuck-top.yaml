title: ECMA tuck top with snap-lock (1-2-3) bottom
notes: >-
  ECMA Code of Folding Carton Design Styles, revised edition September 2009. Trade-name to code mapping
  is the corpus's reading of ECMA code definitions and drawings; ECMA gives codes, not names. Description
  is our own wording. 1992 code A5520. Closure value 55 = self-locking envelope closure (unglued). A55.20.01.01
  is valid by the rules but not illustrated; 'A50.20' quoted for snap lock [S13] is the claw lock. Slower
  to erect than a crash-lock bottom. Erection flag not recorded in the corpus.
