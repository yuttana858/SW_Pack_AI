id: lib.factors.storage-time
type: factor_set
version: 0.1.0
scope: global
tier: L1
status: draft
confidence: industry-typical
title: BCT multipliers for storage time under load (creep)
notes: >-
  FBA BCT loss factors as reproduced by Popil (Georgia Tech RBI) [S13], also in [S1][S2]. Factors are
  empirical and multiplied with other factors by convention. VERIFY: whether the storage-time factors
  already include some humidity effect is not stated in [S13]; check the Fibre Box Handbook text. VERIFY:
  an MSU study reportedly found published retention factors greatly overestimate long-term endurance [S8]
  (attribution not confirmed), so the product may be non-conservative. Moody & Skidmore 1966 (55 % retained
  after three months, attribution VERIFY) [S5] and AICC (nearly 45 % loss after 90 days humid storage)
  [S9] are consistent with 90 days. Kellicutt & Landt log-time relation not retrieved. Do not interpolate
  between rows without a source.
provenance:
  method: published
  sources: [kb.performance.environmental-factors#S13, kb.performance.environmental-factors#S1, kb.performance.environmental-factors#S2,
    kb.performance.environmental-factors#S5, kb.performance.environmental-factors#S8, kb.performance.environmental-factors#S9,
    kb.performance.stacking-load-calc#S1, kb.performance.stacking-load-calc#S2]
factors:
  kind: storage-time
  rows:
  - condition: 10 days under load
    value: 0.63
    basis: lab BCT at 23 °C / 50 %RH, short-term compression test; multiplier = 1 - fractional loss
    cite: &id001 [kb.performance.environmental-factors#S13, kb.performance.environmental-factors#S1, kb.performance.environmental-factors#S2]
  - condition: 30 days under load
    value: 0.6
    basis: lab BCT at 23 °C / 50 %RH, short-term compression test; multiplier = 1 - fractional loss
    cite: *id001
  - condition: 90 days under load
    value: 0.55
    basis: lab BCT at 23 °C / 50 %RH, short-term compression test; multiplier = 1 - fractional loss
    cite: *id001
  - condition: 180 days under load
    value: 0.5
    basis: lab BCT at 23 °C / 50 %RH, short-term compression test; multiplier = 1 - fractional loss
    cite: *id001
