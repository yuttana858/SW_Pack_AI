confidence: reference
title: NMFC Item 222 / UFC Rule 41 triple-wall grades (puncture + facings or ECT)
notes: >-
  Regulatory status: NMFC Item 222 (motor/LTL) and UFC Rule 41 (rail) are carrier tariff material rules,
  not performance tests; the official texts are paid publications and were not read. Values come from
  an Item 222-derived chart in a Walmart specification hosted by FBA, plus converter charts. As of 2026-11-09
  Item 222 appears to remain in the NMFC (Docket 2026-2 Subject 32 analysis still cites Items 220, 221
  and 222; no cancelling docket found) - VERIFY against the current NMFC. UFC Rule 41 supplement effective
  date VERIFY. Check the current tariff before certifying a box or handling a freight claim. Burst route
  (Table A) needs burst plus min combined facings; ECT route (Table B) needs ECT only (no facings requirement).
  The table system enum allows only one of item222-burst / item222-ect; each row carries both routes,
  so system is set to item222-ect and the burst columns are the Table A alternative. SI values are the
  corpus unit conversions. Triple wall has no burst route: the 700-1300 values are a minimum PUNCTURE
  test (in-oz per inch of tear, TAPPI T 803 / ISO 3036), not burst psi. Conflict resolved in the corpus:
  converter charts (Cary [S4], Nelson [S5] in rule41-item222) label them burst and Nelson lists the 240-300
  lb rows as double wall - both wrong per the Item 222-derived chart. A further chart (Arlington, combined-board-grades
  S13: 61 ECT up to 300 lb, 82 ECT up to 500 lb) does not match and is treated as unreliable. The schema
  field `puncture` is unitless; the unit and the derived J/m conversion (1 in-oz/in = 0.27801 J/m) are
  in each row's `limits`. Facings weight includes the centre facings.
