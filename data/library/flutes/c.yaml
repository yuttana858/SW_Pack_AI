title: C-flute (medium) profile
notes: >-
  Flute height excluding facings: DIN 55468 range 3.2-4.0 mm [S3]; FEFCO 3.6 mm [S1][S15]; Nordstrand
  3.61 mm [S2]. US flute thickness 4.0 mm (5/32 in) [S20] is a different quantity (no schema field). flutes_per_m
  = [128 (US table, +/-10) [S20], 130 FEFCO [S15]]. flutes_per_ft = 39 +/- 3 per US table [S20]; FBA gives
  38 [S16] (both kept: VERIFY which nominal to use; they agree within the +/-3 band). take_up range FEFCO
  [S15], typical 1.43 Nordstrand [S2]. Other corpus values: kb.performance.board-tests-and-ect quotes
  C 1.45 and approx. 1.42 (both inside the FEFCO range); kb.dimensional.tolerances (FEFCO/VDW catalogue)
  gives C flute height >= 3.1 to < 4.0 mm, slightly different from DIN 3.2-4.0 (VERIFY). single_wall_caliper_mm
  approx. 3.5-4 mm [S7].
